<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descomposición en Factores Primos</title>
    <!-- Fabric.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary: #8b5cf6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success: #15803d;
            --success-bg: #dcfce7;
            --error: #b91c1c;
            --error-bg: #fee2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- PANTALLA DE EXAMEN / REVISIÓN --- */
        #examScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .counter {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .target-num {
            font-weight: 700;
            font-size: 1.3rem;
            background: #eff6ff;
            padding: 4px 12px;
            border-radius: 6px;
            color: var(--primary-dark);
        }

        .review-badge {
            display: none;
            background-color: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .instructions {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            width: 100%;
        }

        .canvas-container-wrapper {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: #ffffff;
        }

        .controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        /* --- BOTONES --- */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }

        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }

        .btn-secondary { background-color: #64748b; color: white; }
        .btn-secondary:hover { background-color: #475569; }

        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }

        /* --- PANTALLA DE RESULTADOS --- */
        #resultsScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .results-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .result-card {
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background: #fff;
        }

        .result-card.correct {
            border-left: 6px solid var(--success);
            background-color: var(--success-bg);
        }

        .result-card.incorrect {
            border-left: 6px solid var(--error);
            background-color: var(--error-bg);
        }

        .card-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .badge-status {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-status.correct { background: var(--success); color: white; }
        .badge-status.incorrect { background: var(--error); color: white; }

        .factor-comparison {
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>Factorización de Números Primos</h1>
    </header>

    <div class="container">
        <!-- PANTALLA DE EXAMEN -->
        <div id="examScreen">
            <div class="header-info">
                <span id="exerciseCounter" class="counter">Ejercicio 1 / 10</span>
                <span id="reviewIndicator" class="review-badge">Modo Revisión</span>
                <span id="targetNumDisplay" class="target-num">Número: --</span>
            </div>

            <div id="instructionsBox" class="instructions">
                ✍️ Haz clic en los signos <b>?</b> en el lienzo para escribir el divisor primo (derecha) y el cociente resultante (izquierda). Presiona <b>"Añadir Paso"</b> para confirmar cada nivel.
            </div>

            <div class="canvas-container-wrapper">
                <canvas id="factorCanvas" width="550" height="380"></canvas>
            </div>

            <div class="controls-panel">
                <button id="btnAddStep" class="btn btn-primary">➕ Añadir Paso</button>
                <button id="btnDeleteStep" class="btn btn-danger">🗑️ Borrar Último Paso</button>
                <button id="btnPrevEx" class="btn btn-secondary" style="display: none;">⬅️ Anterior</button>
                <button id="btnNextEx" class="btn btn-primary">Siguiente Número ➔</button>
                <button id="btnBackToSummary" class="btn btn-secondary" style="display: none;">📋 Volver al Resumen</button>
            </div>
        </div>

        <!-- PANTALLA DE RESULTADOS -->
        <div id="resultsScreen">
            <div class="results-header">
                <h2 id="finalScoreTitle">Resultados del Examen</h2>
            </div>

            <div id="resultsGrid" class="results-grid"></div>

            <div class="controls-panel">
                <button id="btnReviewBoard" class="btn btn-primary">🔍 Revisar Ejercicios en Pizarra</button>
                <button id="btnRestart" class="btn btn-success">🔄 Volver a Intentar</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN Y AUTO-INICIALIZACIÓN ---
        const ALL_VALID_NUMBERS = [
            6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 27, 30, 32, 36, 40, 45, 48, 50,
            54, 60, 64, 72, 75, 80, 81, 90, 96, 100, 108, 120, 125, 128, 135, 144,
            150, 160, 162, 180, 192, 200, 216, 225, 240, 243, 250, 256, 270, 288, 300
        ];

        // Función para seleccionar 10 números aleatorios del pool
        function getRandom10Numbers() {
            const shuffled = [...ALL_VALID_NUMBERS].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 10);
        }

        // Estructura de inputs simulados para mantener compatibilidad pura con la firma de la función
        let mockInputs = Array.from({ length: 10 }, () => ({ value: '', readOnly: false }));

        window.addEventListener('load', () => {
            const selected10 = getRandom10Numbers();
            factoriza(selected10, mockInputs);
        });

        // --- 2. CÓDIGO DEL EXAMEN (LÓGICA ADAPTADA) ---
        function factoriza(selected, inpTxt) {
            let examExercises = [];
            let currentIndex = 0;
            let isReviewMode = inpTxt[0] ? inpTxt[0].readOnly : false;

            let canvas = null;
            let activeFactorBox = null;
            let activeQuotientBox = null;

            initFabricCanvas();
            startNewExam();

            document.getElementById('btnAddStep').onclick = handleAddStep;
            document.getElementById('btnDeleteStep').onclick = handleDeleteStep;
            document.getElementById('btnNextEx').onclick = handleNextExercise;
            document.getElementById('btnPrevEx').onclick = handlePrevExercise;
            document.getElementById('btnRestart').onclick = () => {
                const newSelected = getRandom10Numbers();
                mockInputs = Array.from({ length: 10 }, () => ({ value: '', readOnly: false }));
                factoriza(newSelected, mockInputs);
            };
            document.getElementById('btnReviewBoard').onclick = enterReviewMode;
            document.getElementById('btnBackToSummary').onclick = showResultsSummary;

            function initFabricCanvas() {
                canvas = new fabric.Canvas('factorCanvas', {
                    selection: false,
                    backgroundColor: '#ffffff'
                });

                canvas.on('object:moving', (e) => {
                    const obj = e.target;
                    if (obj._initialLeft !== undefined) obj.left = obj._initialLeft;
                    if (obj._initialTop !== undefined) obj.top = obj._initialTop;
                });
            }

            function startNewExam() {
                examExercises = selected.map(num => ({
                    number: num,
                    userSteps: [],
                    isCorrect: false,
                    errorMessage: '',
                    correctFactors: getPrimeFactors(num)
                }));

                currentIndex = 0;
                isReviewMode = false;
                
                document.getElementById('examScreen').style.display = 'flex';
                document.getElementById('resultsScreen').style.display = 'none';
                document.getElementById('reviewIndicator').style.display = 'none';
                document.getElementById('instructionsBox').style.display = 'block';
                document.getElementById('btnBackToSummary').style.display = 'none';
                document.getElementById('btnPrevEx').style.display = 'none';
                document.getElementById('btnAddStep').style.display = 'inline-flex';
                document.getElementById('btnDeleteStep').style.display = 'inline-flex';
                document.getElementById('btnNextEx').textContent = "Siguiente Número ➔";

                loadExercise(0);
            }

            function loadExercise(index) {
                currentIndex = index;
                const ex = examExercises[currentIndex];

                document.getElementById('exerciseCounter').textContent = `Ejercicio ${currentIndex + 1} / 10`;
                document.getElementById('targetNumDisplay').textContent = `Número: ${ex.number}`;

                if (isReviewMode) {
                    document.getElementById('btnPrevEx').style.display = currentIndex > 0 ? 'inline-flex' : 'none';
                    document.getElementById('btnNextEx').style.display = currentIndex < 9 ? 'inline-flex' : 'none';
                    document.getElementById('btnNextEx').textContent = "Siguiente ➔";
                } else {
                    document.getElementById('btnPrevEx').style.display = 'none';
                    document.getElementById('btnNextEx').style.display = 'inline-flex';
                    document.getElementById('btnNextEx').textContent = currentIndex === 9 ? "Finalizar y Corregir 🏁" : "Siguiente Número ➔";
                }

                renderBoard();
            }

            function renderBoard() {
                canvas.clear();
                const ex = examExercises[currentIndex];
                const startY = 50;
                const lineHeight = 42;

                if (isReviewMode && !ex.isCorrect) {
                    drawVerticalFactorization(140, startY, lineHeight, ex.number, ex.userSteps, true, "Tu Respuesta (Incorrecta)");

                    const middleDivider = new fabric.Line([275, 20, 275, 340], {
                        stroke: '#cbd5e1',
                        strokeWidth: 2,
                        strokeDashArray: [6, 4],
                        selectable: false,
                        evented: false
                    });
                    canvas.add(middleDivider);

                    const correctSteps = [];
                    let tempNum = ex.number;
                    ex.correctFactors.forEach(f => {
                        tempNum /= f;
                        correctSteps.push({ factor: f, quotient: tempNum });
                    });

                    drawVerticalFactorization(410, startY, lineHeight, ex.number, correctSteps, false, "Factorización Correcta");

                } else {
                    drawVerticalFactorization(275, startY, lineHeight, ex.number, ex.userSteps, isReviewMode, isReviewMode ? "Respuesta Correcta" : null);

                    const lastQuotient = ex.userSteps.length > 0 ? ex.userSteps[ex.userSteps.length - 1].quotient : ex.number;

                    if (!isReviewMode && lastQuotient !== 1) {
                        const activeY = startY + (ex.userSteps.length * lineHeight);

                        activeFactorBox = createEditableBox('?', 275 + 25, activeY, '#3b82f6', 'left');
                        activeQuotientBox = createEditableBox('?', 275 - 25, activeY + lineHeight, '#8b5cf6', 'right');

                        canvas.add(activeFactorBox);
                        canvas.add(activeQuotientBox);
                        canvas.setActiveObject(activeFactorBox);
                    } else {
                        activeFactorBox = null;
                        activeQuotientBox = null;
                    }
                }

                canvas.renderAll();
            }

            function drawVerticalFactorization(centerX, startY, lineHeight, number, steps, isErrorStyle, titleHeader) {
                if (titleHeader) {
                    const titleText = new fabric.Text(titleHeader, {
                        left: centerX,
                        top: 15,
                        fontFamily: 'Segoe UI, sans-serif',
                        fontSize: 15,
                        fontWeight: 'bold',
                        fill: isErrorStyle ? '#b91c1c' : '#15803d',
                        originX: 'center',
                        selectable: false,
                        evented: false
                    });
                    canvas.add(titleText);
                }

                const maxRows = Math.max(steps.length + 1, 4);
                const line = new fabric.Line([centerX, startY - 10, centerX, startY + (maxRows * lineHeight)], {
                    stroke: '#1e293b',
                    strokeWidth: 3,
                    selectable: false,
                    evented: false
                });
                canvas.add(line);

                const startNumText = new fabric.Text(number.toString(), {
                    left: centerX - 25,
                    top: startY,
                    fontFamily: 'Segoe UI, sans-serif',
                    fontSize: 24,
                    fontWeight: 'bold',
                    fill: '#1e293b',
                    originX: 'right',
                    selectable: false,
                    evented: false
                });
                canvas.add(startNumText);

                steps.forEach((step, i) => {
                    const currentY = startY + (i * lineHeight);

                    const factorText = new fabric.Text(step.factor.toString(), {
                        left: centerX + 25,
                        top: currentY,
                        fontFamily: 'Segoe UI, sans-serif',
                        fontSize: 24,
                        fontWeight: 'bold',
                        fill: isReviewMode ? (isErrorStyle ? '#b91c1c' : '#15803d') : '#3b82f6',
                        originX: 'left',
                        selectable: false,
                        evented: false
                    });
                    canvas.add(factorText);

                    const quotText = new fabric.Text(step.quotient.toString(), {
                        left: centerX - 25,
                        top: currentY + lineHeight,
                        fontFamily: 'Segoe UI, sans-serif',
                        fontSize: 24,
                        fontWeight: 'bold',
                        fill: isReviewMode ? (isErrorStyle ? '#b91c1c' : '#15803d') : '#8b5cf6',
                        originX: 'right',
                        selectable: false,
                        evented: false
                    });
                    canvas.add(quotText);
                });
            }

            function createEditableBox(defaultText, left, top, color, originX) {
                const box = new fabric.IText(defaultText, {
                    left: left,
                    top: top,
                    fontFamily: 'Segoe UI, sans-serif',
                    fontSize: 24,
                    fontWeight: 'bold',
                    fill: color,
                    originX: originX,
                    editable: true,
                    hasControls: false,
                    hasBorders: false,
                    lockMovementX: true,
                    lockMovementY: true,
                    lockRotation: true,
                    lockScalingX: true,
                    lockScalingY: true
                });

                box._initialLeft = left;
                box._initialTop = top;

                const clearInterrogation = () => {
                    if (box.text.includes('?')) {
                        box.text = box.text.replace(/\?/g, '');
                        canvas.renderAll();
                    }
                };

                const restoreInterrogationIfNeeded = () => {
                    const cleanText = box.text.replace(/\?/g, '').trim();
                    if (cleanText === "") {
                        box.text = '?';
                        canvas.renderAll();
                    }
                };

                function actualiza() {
                    clearInterrogation();
                    const currentSteps = [...examExercises[currentIndex].userSteps];

                    if (activeFactorBox && activeQuotientBox) {
                        const factorVal = parseInt(activeFactorBox.text.replace(/\?/g, '').trim());
                        const quotientVal = parseInt(activeQuotientBox.text.replace(/\?/g, '').trim());

                        if (!isNaN(factorVal) || !isNaN(quotientVal)) {
                            currentSteps.push({
                                factor: isNaN(factorVal) ? null : factorVal,
                                quotient: isNaN(quotientVal) ? null : quotientVal
                            });
                        }
                    }

                    if (inpTxt !== "" && inpTxt[currentIndex]) {
                        inpTxt[currentIndex].value = JSON.stringify(currentSteps);
                    }
                }

                box.on('editing:entered', clearInterrogation);
                box.on('selection:created', clearInterrogation);
                box.on('changed', actualiza);
                box.on('editing:exited', restoreInterrogationIfNeeded);

                return box;
            }

            function handleAddStep(e) {
                if (e) e.preventDefault();
                if (isReviewMode || !activeFactorBox || !activeQuotientBox) return;

                const factorVal = parseInt(activeFactorBox.text.replace(/\?/g, '').trim());
                const quotientVal = parseInt(activeQuotientBox.text.replace(/\?/g, '').trim());

                if (isNaN(factorVal) || isNaN(quotientVal)) {
                    alert("Por favor, escribe números válidos en ambas casillas antes de continuar.");
                    return;
                }

                examExercises[currentIndex].userSteps.push({
                    factor: factorVal,
                    quotient: quotientVal
                });

                renderBoard();
            }

            function handleDeleteStep(e) {
                if (e) e.preventDefault();
                if (isReviewMode) return;
                const ex = examExercises[currentIndex];
                if (ex.userSteps.length > 0) {
                    ex.userSteps.pop();
                    renderBoard();
                }
            }

            function handleNextExercise(e) {
                if (e) e.preventDefault();
                if (!isReviewMode) {
                    if (activeFactorBox && activeQuotientBox) {
                        const fVal = parseInt(activeFactorBox.text.replace(/\?/g, '').trim());
                        const qVal = parseInt(activeQuotientBox.text.replace(/\?/g, '').trim());
                        if (!isNaN(fVal) && !isNaN(qVal)) {
                            examExercises[currentIndex].userSteps.push({
                                factor: fVal,
                                quotient: qVal
                            });
                        }
                    }

                    if (currentIndex < 9) {
                        loadExercise(currentIndex + 1);
                    } else {
                        evaluateAndShowResults();
                    }
                } else {
                    if (currentIndex < 9) loadExercise(currentIndex + 1);
                }
            }

            function handlePrevExercise(e) {
                if (e) e.preventDefault();
                if (currentIndex > 0) {
                    loadExercise(currentIndex - 1);
                }
            }

            function evaluateAndShowResults(e) {
                if (e) e.preventDefault();
                examExercises.forEach(ex => {
                    const target = ex.number;
                    const steps = ex.userSteps;

                    if (steps.length === 0) {
                        ex.isCorrect = false;
                        ex.errorMessage = "Ejercicio sin responder.";
                        return;
                    }

                    let currentNum = target;
                    let valid = true;
                    let errReason = "";

                    for (let i = 0; i < steps.length; i++) {
                        const f = steps[i].factor;
                        const q = steps[i].quotient;

                        if (!isPrime(f)) {
                            valid = false;
                            errReason = `El número ${f} no es primo.`;
                            break;
                        }

                        if (currentNum % f !== 0) {
                            valid = false;
                            errReason = `${currentNum} no es divisible entre ${f}.`;
                            break;
                        }

                        if (currentNum / f !== q) {
                            valid = false;
                            errReason = `Error de cálculo: ${currentNum} ÷ ${f} no es ${q}.`;
                            break;
                        }

                        currentNum = q;
                    }

                    if (valid && currentNum !== 1) {
                        valid = false;
                        errReason = `Descomposición incompleta (no se llegó al cociente 1).`;
                    }

                    ex.isCorrect = valid;
                    ex.errorMessage = errReason;
                });

                showResultsSummary();
            }

            function showResultsSummary(e) {
                if (e) e.preventDefault();
                document.getElementById('examScreen').style.display = 'none';
                document.getElementById('resultsScreen').style.display = 'flex';

                const correctCount = examExercises.filter(e => e.isCorrect).length;
                document.getElementById('finalScoreTitle').textContent = `Resultado: ${correctCount} de 10 Correctos (${correctCount * 10}%)`;

                const resultsGrid = document.getElementById('resultsGrid');
                resultsGrid.innerHTML = '';

                examExercises.forEach((ex, idx) => {
                    const card = document.createElement('div');
                    card.className = `result-card ${ex.isCorrect ? 'correct' : 'incorrect'}`;

                    const userFactorsStr = ex.userSteps.map(s => s.factor).join(' × ') || 'Ninguna';
                    const correctFactorsStr = ex.correctFactors.join(' × ');
                    const correctPowerStr = formatPowers(ex.correctFactors);

                    card.innerHTML = `
                        <div class="card-title-bar">
                            <strong>#${idx + 1}. Número: ${ex.number}</strong>
                            <span class="badge-status ${ex.isCorrect ? 'correct' : 'incorrect'}">
                                ${ex.isCorrect ? 'Correcto' : 'Incorrecto'}
                            </span>
                        </div>
                        <div class="factor-comparison">
                            <div><b>Tu respuesta:</b> ${userFactorsStr}</div>
                            ${!ex.isCorrect ? `<div style="color: #b91c1c; font-size: 0.85rem; margin-top:2px;">⚠️ ${ex.errorMessage}</div>` : ''}
                            <div class="correct-ans" style="margin-top: 4px;">
                                <b>Factorización Correcta:</b> ${correctFactorsStr} (${correctPowerStr})
                            </div>
                        </div>
                    `;

                    resultsGrid.appendChild(card);
                });
            }

            function enterReviewMode(e) {
                if (e) e.preventDefault();
                isReviewMode = true;
                document.getElementById('examScreen').style.display = 'flex';
                document.getElementById('resultsScreen').style.display = 'none';

                document.getElementById('reviewIndicator').style.display = 'inline-block';
                document.getElementById('instructionsBox').style.display = 'none';
                document.getElementById('btnBackToSummary').style.display = 'inline-flex';
                document.getElementById('btnAddStep').style.display = 'none';
                document.getElementById('btnDeleteStep').style.display = 'none';

                loadExercise(0);
            }

            function getPrimeFactors(n) {
                const factors = [];
                let num = n;
                for (let d = 2; d * d <= num; d++) {
                    while (num % d === 0) {
                        factors.push(d);
                        num /= d;
                    }
                }
                if (num > 1) factors.push(num);
                return factors;
            }

            function isPrime(num) {
                if (num < 2) return false;
                for (let i = 2; i <= Math.sqrt(num); i++) {
                    if (num % i === 0) return false;
                }
                return true;
            }

            function formatPowers(factors) {
                const counts = {};
                factors.forEach(f => counts[f] = (counts[f] || 0) + 1);

                const mapSuperscript = {
                    '2': '²', '3': '³', '4': '⁴',
                    '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸'
                };

                return Object.entries(counts)
                    .map(([f, count]) => count > 1 ? `${f}${mapSuperscript[count] || '^' + count}` : f)
                    .join(' × ');
            }
        }
    </script>
</body>
</html>
