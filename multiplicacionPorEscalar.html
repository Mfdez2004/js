<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplicación por un Escalar como Suma Repetida (k · A)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            touch-action: none;
        }
    </style>
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']] // Permite usar $...$ para matemáticas en línea
      }
    };
  </script>

  <!-- 2. Carga de la librería MathJax desde CDN -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-ch
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Multiplicación por Escalar: \(k \cdot \vec{A} = \vec{A} + \vec{A} + \dots\)
                </h1>
                <p class="text-xs text-slate-400">Observa cómo la multiplicación por un entero positivo o negativo equivale a sumar el vector consigo mismo.</p>
            </div>
            
            <button id="btn-reset" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded transition duration-150 text-xs font-medium flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Reiniciar Vista
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <!-- Canvas Area -->
        <div class="lg:col-span-3 bg-slate-800 rounded-xl border border-slate-700 shadow-xl overflow-hidden flex flex-col relative">
            
            <!-- Controls Bar -->
            <div class="p-3 bg-slate-800/90 border-b border-slate-700 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div class="flex items-center gap-4 flex-wrap">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="chk-grid" checked class="rounded border-slate-600 text-amber-500 focus:ring-amber-500 bg-slate-700">
                        <span>Cuadrícula</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="chk-snap" checked class="rounded border-slate-600 text-amber-500 focus:ring-amber-500 bg-slate-700">
                        <span>Ajustar a Cuadrícula</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="chk-guides" checked class="rounded border-slate-600 text-amber-500 focus:ring-amber-500 bg-slate-700">
                        <span>Líneas de Dirección</span>
                    </label>
                    
                    <!-- Casilla Mostrar Vector Resultado -->
                    <label class="flex items-center gap-2 cursor-pointer select-none bg-amber-950/40 border border-amber-500/30 px-2.5 py-1 rounded-md">
                        <input type="checkbox" id="chk-show-result" checked class="rounded border-slate-600 text-amber-500 focus:ring-amber-500 bg-slate-700">
                        <span class="text-amber-300 font-bold">Mostrar Resultado Total ($k \cdot \vec{A}$)</span>
                    </label>
                </div>
            </div>

            <!-- Canvas Container -->
            <div class="flex-1 min-h-[480px] relative w-full h-full cursor-crosshair" id="canvas-container">
                <canvas id="vectorCanvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>
            
            <!-- Directing notice -->
            <div class="p-2 bg-slate-900/60 border-t border-slate-700/50 text-[11px] text-slate-400 flex justify-between">
                <span>Puntos de control reducidos • Flechas en relieve</span>
                <span id="equation-display" class="font-mono text-amber-400 font-bold">3 · A = A + A + A</span>
            </div>
        </div>

        <!-- Sidebar / Controls Panel -->
        <div class="flex flex-col gap-4">
            
            <!-- Scalar Value Selector -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-lg space-y-4">
                <h2 class="text-sm font-semibold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                    Valor del Escalar ($k$)
                </h2>

                <!-- Presets / Quick buttons -->
                <div class="grid grid-cols-5 gap-1.5 text-xs font-mono">
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="-3">-3</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="-2">-2</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="-1">-1</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="0">0</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="1">1</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="2">2</button>
                    <button class="btn-k bg-amber-600 text-white py-1.5 rounded font-bold transition" data-k="3">3</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="4">4</button>
                    <button class="btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition" data-k="5">5</button>
                </div>

                <!-- Slider for k -->
                <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/60">
                    <div class="flex justify-between items-center text-xs mb-1">
                        <span class="font-medium text-slate-300">Escalar $k$:</span>
                        <span id="val-k" class="font-mono text-amber-400 text-base font-bold">3</span>
                    </div>
                    <input type="range" id="slider-k" min="-4" max="5" step="1" value="3" class="w-full accent-amber-500 cursor-pointer">
                </div>
            </div>

            <!-- Animation Controls -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-lg space-y-3">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Animación Paso a Paso</h2>
                
                <div class="flex items-center gap-2">
                    <button id="btn-play" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition">
                        <svg id="play-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"></path></svg>
                        <span id="play-text">Reproducir Suma</span>
                    </button>
                    <button id="btn-prev" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-slate-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button id="btn-next" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-slate-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>

                <div class="text-center text-xs text-slate-400 font-mono">
                    Paso visualizado: <span id="step-count" class="text-amber-400 font-bold">3</span> / <span id="step-total" class="font-bold">3</span>
                </div>
            </div>

            <!-- Vector Numerical Info -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-4 shadow-lg flex-1 space-y-3">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Información Numérica</h2>
                
                <!-- Vector A -->
                <div class="p-2.5 rounded bg-slate-900/60 border-l-4 border-red-500 text-xs">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-red-400">Vector Base (A)</span>
                        <span id="vecA-mag" class="font-mono text-slate-300">|A| = 0.0</span>
                    </div>
                    <div class="font-mono text-slate-400 grid grid-cols-2 gap-1 text-[11px]">
                        <span id="vecA-comp">Comp: (0, 0)</span>
                        <span id="vecA-ang">Áng: 0°</span>
                    </div>
                </div>

                <!-- Resulting Vector -->
                <div class="p-2.5 rounded bg-slate-900/60 border-l-4 border-amber-500 text-xs">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-amber-400">Resultado ($k \cdot \vec{A}$)</span>
                        <span id="vecR-mag" class="font-mono text-slate-300">|R| = 0.0</span>
                    </div>
                    <div class="font-mono text-slate-400 grid grid-cols-2 gap-1 text-[11px]">
                        <span id="vecR-comp">Comp: (0, 0)</span>
                        <span id="vecR-ang">Áng: 0°</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- CONSTANTES DE CONFIGURACIÓN ---
        const GRID_SIZE = 25;
        
        // Puntos de control pequeños y extremos destacados
        const NODE_RADIUS = 5;
        const NODE_HIT_RADIUS = 16;
        const ARROW_HEAD_LEN = 16;
        const ARROW_HEAD_ANGLE = Math.PI / 6;

        // Colores
        const COLOR_A = '#ef4444';        // Rojo (Vector Base)
        const COLOR_STEP = '#38bdf8';     // Azul claro (Suma secuencial)
        const COLOR_RESULT = '#f59e0b';   // Ámbar (Vector Multiplicado Final)

        // Elementos UI
        const canvas = document.getElementById('vectorCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        const chkGrid = document.getElementById('chk-grid');
        const chkSnap = document.getElementById('chk-snap');
        const chkGuides = document.getElementById('chk-guides');
        const chkShowResult = document.getElementById('chk-show-result');
        const btnReset = document.getElementById('btn-reset');

        const sliderK = document.getElementById('slider-k');
        const valK = document.getElementById('val-k');

        const btnPlay = document.getElementById('btn-play');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const stepCountText = document.getElementById('step-count');
        const stepTotalText = document.getElementById('step-total');
        const equationDisplay = document.getElementById('equation-display');

        // Estado del Sistema
        let kValue = 3;
        let visibleSteps = 3;
        let isPlaying = false;
        let animInterval = null;

        let vecA = {
            start: { x: 0, y: 0 },
            end: { x: 0, y: 0 }
        };

        let dragTarget = null; // 'start' | 'end' | 'body'

        // --- INICIALIZACIÓN ---
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }

        function initPositions() {
            const width = canvas.width || 800;
            const height = canvas.height || 600;

            const centerX = Math.floor(width / 3 / GRID_SIZE) * GRID_SIZE;
            const centerY = Math.floor(height / 2 / GRID_SIZE) * GRID_SIZE;

            vecA.start = { x: centerX, y: centerY };
            vecA.end = { x: centerX + GRID_SIZE * 3, y: centerY - GRID_SIZE * 2 };

            kValue = 3;
            sliderK.value = 3;
            valK.textContent = '3';
            visibleSteps = Math.abs(kValue);

            stopAnimation();
            draw();
        }

        window.addEventListener('resize', resizeCanvas);
        btnReset.addEventListener('click', initPositions);

        [chkGrid, chkSnap, chkGuides, chkShowResult].forEach(chk => chk.addEventListener('change', draw));

        // Eventos del slider k
        sliderK.addEventListener('input', () => {
            kValue = parseInt(sliderK.value);
            valK.textContent = kValue;
            updateKButtons();
            visibleSteps = Math.abs(kValue);
            stopAnimation();
            draw();
        });

        // Botones rápidos para k
        document.querySelectorAll('.btn-k').forEach(btn => {
            btn.addEventListener('click', (e) => {
                kValue = parseInt(e.target.getAttribute('data-k'));
                sliderK.value = kValue;
                valK.textContent = kValue;
                updateKButtons();
                visibleSteps = Math.abs(kValue);
                stopAnimation();
                draw();
            });
        });

        function updateKButtons() {
            document.querySelectorAll('.btn-k').forEach(btn => {
                const val = parseInt(btn.getAttribute('data-k'));
                if (val === kValue) {
                    btn.className = "btn-k bg-amber-600 text-white py-1.5 rounded font-bold transition";
                } else {
                    btn.className = "btn-k bg-slate-700 hover:bg-amber-600 py-1.5 rounded font-bold transition";
                }
            });
        }

        // --- ANIMACIÓN ---
        btnPlay.addEventListener('click', () => {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        });

        btnPrev.addEventListener('click', () => {
            stopAnimation();
            if (visibleSteps > 0) visibleSteps--;
            draw();
        });

        btnNext.addEventListener('click', () => {
            stopAnimation();
            if (visibleSteps < Math.abs(kValue)) visibleSteps++;
            draw();
        });

        function startAnimation() {
            if (Math.abs(kValue) === 0) return;
            isPlaying = true;
            visibleSteps = 0;
            document.getElementById('play-text').textContent = 'Pausar';
            document.getElementById('play-icon').innerHTML = `<path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"></path>`;

            animInterval = setInterval(() => {
                if (visibleSteps < Math.abs(kValue)) {
                    visibleSteps++;
                    draw();
                } else {
                    stopAnimation();
                }
            }, 700);
            draw();
        }

        function stopAnimation() {
            isPlaying = false;
            if (animInterval) clearInterval(animInterval);
            document.getElementById('play-text').textContent = 'Reproducir Suma';
            document.getElementById('play-icon').innerHTML = `<path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"></path>`;
        }

        // --- FUNCIONES MATEMÁTICAS ---
        function snap(value) {
            return chkSnap.checked ? Math.round(value / GRID_SIZE) * GRID_SIZE : value;
        }

        function getVectorComponents(vec) {
            return {
                x: (vec.end.x - vec.start.x) / GRID_SIZE,
                y: -(vec.end.y - vec.start.y) / GRID_SIZE
            };
        }

        function getMagnitude(comp) {
            return Math.sqrt(comp.x * comp.x + comp.y * comp.y);
        }

        function getAngle(comp) {
            let deg = Math.atan2(comp.y, comp.x) * (180 / Math.PI);
            return deg < 0 ? deg + 360 : deg;
        }

        // --- DIBUJO EN CANVAS ---
        function drawArrow(from, to, color, width = 3, opacity = 1.0, dash = []) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            if (dash.length > 0) ctx.setLineDash(dash);

            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const angle = Math.atan2(dy, dx);
            const dist = Math.hypot(dx, dy);

            // Cuerpo de la Flecha
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.stroke();

            ctx.setLineDash([]);

            // Punta de la Flecha Rellena
            if (dist > 5) {
                ctx.beginPath();
                ctx.moveTo(to.x, to.y);
                ctx.lineTo(
                    to.x - ARROW_HEAD_LEN * Math.cos(angle - ARROW_HEAD_ANGLE),
                    to.y - ARROW_HEAD_LEN * Math.sin(angle - ARROW_HEAD_ANGLE)
                );
                ctx.lineTo(
                    to.x - ARROW_HEAD_LEN * Math.cos(angle + ARROW_HEAD_ANGLE),
                    to.y - ARROW_HEAD_LEN * Math.sin(angle + ARROW_HEAD_ANGLE)
                );
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function drawNode(point, color, isSelected = false) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(point.x, point.y, isSelected ? NODE_RADIUS + 2 : NODE_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.restore();
        }

        function drawGrid() {
            if (!chkGrid.checked) return;
            ctx.save();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.5;

            for (let x = 0; x < canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawLabel(point, text, color) {
            ctx.save();
            ctx.font = 'bold 13px sans-serif';
            ctx.fillStyle = color;
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(text, point.x + 8, point.y - 8);
            ctx.restore();
        }

        // --- RENDERIZADO GENERAL ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            const dx = vecA.end.x - vecA.start.x;
            const dy = vecA.end.y - vecA.start.y;
            const absK = Math.abs(kValue);

            // Vector individual paso a paso (si k < 0, se invierte la dirección)
            const stepDx = kValue >= 0 ? dx : -dx;
            const stepDy = kValue >= 0 ? dy : -dy;

            // 1. Línea de dirección infinita
            if (chkGuides.checked && absK > 0) {
                ctx.save();
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.2)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(vecA.start.x - stepDx * 10, vecA.start.y - stepDy * 10);
                ctx.lineTo(vecA.start.x + stepDx * 10, vecA.start.y + stepDy * 10);
                ctx.stroke();
                ctx.restore();
            }

            // 2. Dibujar Suma Repetida Cabeza con Cola
            let currentStart = { x: vecA.start.x, y: vecA.start.y };

            if (kValue === 0) {
                // Caso k = 0: Punto en el origen
                drawNode(vecA.start, COLOR_RESULT, true);
                drawLabel(vecA.start, '0 · A = 0', COLOR_RESULT);
            } else {
                for (let i = 0; i < visibleSteps; i++) {
                    let currentEnd = {
                        x: currentStart.x + stepDx,
                        y: currentStart.y + stepDy
                    };

                    const labelText = kValue < 0 ? `-A (${i + 1})` : `A (${i + 1})`;
                    const stepColor = (i === 0 && kValue > 0) ? COLOR_A : COLOR_STEP;

                    drawArrow(currentStart, currentEnd, stepColor, 2.5, 0.85);
                    drawLabel({ x: (currentStart.x + currentEnd.x) / 2, y: (currentStart.y + currentEnd.y) / 2 }, labelText, stepColor);

                    // Pequeña marca entre los extremos conectados
                    drawNode(currentEnd, stepColor, false);

                    currentStart = currentEnd;
                }
            }

            // 3. Dibujar Vector Resultado Total k · A
            if (chkShowResult.checked && kValue !== 0) {
                const totalEnd = {
                    x: vecA.start.x + stepDx * absK,
                    y: vecA.start.y + stepDy * absK
                };

                // Dibujado desplazado ligeramente si k=1 para no tapar el base
                drawArrow(vecA.start, totalEnd, COLOR_RESULT, 3.5, 0.95);
                drawLabel(totalEnd, `${kValue} · A`, COLOR_RESULT);
            }

            // 4. Dibujar Vector A Original
            const isSelected = dragTarget !== null;
            drawArrow(vecA.start, vecA.end, COLOR_A, isSelected ? 4 : 3);
            drawNode(vecA.start, COLOR_A, dragTarget === 'start');
            drawNode(vecA.end, COLOR_A, dragTarget === 'end');
            drawLabel({ x: (vecA.start.x + vecA.end.x) / 2, y: (vecA.start.y + vecA.end.y) / 2 }, 'A', COLOR_A);

            updateUI();
        }

        // --- INTERACCIÓN ---
        function distToSegment(p, v, w) {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handlePointerDown(e) {
            const pos = getMousePos(e);
            dragTarget = null;

            if (Math.hypot(pos.x - vecA.end.x, pos.y - vecA.end.y) < NODE_HIT_RADIUS) {
                dragTarget = 'end';
                return;
            }
            if (Math.hypot(pos.x - vecA.start.x, pos.y - vecA.start.y) < NODE_HIT_RADIUS) {
                dragTarget = 'start';
                return;
            }

            if (distToSegment(pos, vecA.start, vecA.end) < 12) {
                dragTarget = 'body';
                this.offsetStart = { x: pos.x - vecA.start.x, y: pos.y - vecA.start.y };
                return;
            }
        }

        function handlePointerMove(e) {
            if (!dragTarget) return;
            const pos = getMousePos(e);

            if (dragTarget === 'start') {
                const dx = vecA.end.x - vecA.start.x;
                const dy = vecA.end.y - vecA.start.y;
                vecA.start.x = snap(pos.x);
                vecA.start.y = snap(pos.y);
                vecA.end.x = vecA.start.x + dx;
                vecA.end.y = vecA.start.y + dy;
            } else if (dragTarget === 'end') {
                vecA.end.x = snap(pos.x);
                vecA.end.y = snap(pos.y);
            } else if (dragTarget === 'body') {
                const dx = vecA.end.x - vecA.start.x;
                const dy = vecA.end.y - vecA.start.y;
                vecA.start.x = snap(pos.x - this.offsetStart.x);
                vecA.start.y = snap(pos.y - this.offsetStart.y);
                vecA.end.x = vecA.start.x + dx;
                vecA.end.y = vecA.start.y + dy;
            }

            draw();
        }

        function handlePointerUp() {
            dragTarget = null;
            draw();
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', (e) => { handlePointerDown(e); e.preventDefault(); }, { passive: false });
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        // --- ACTUALIZACIÓN DE DATOS Y PANEL LATERAL ---
        function updateUI() {
            const compA = getVectorComponents(vecA);
            const compR = { x: compA.x * kValue, y: compA.y * kValue };

            document.getElementById('vecA-mag').textContent = `|A| = ${getMagnitude(compA).toFixed(1)}`;
            document.getElementById('vecA-comp').textContent = `Comp: (${compA.x.toFixed(1)}, ${compA.y.toFixed(1)})`;
            document.getElementById('vecA-ang').textContent = `Áng: ${getAngle(compA).toFixed(0)}°`;

            document.getElementById('vecR-mag').textContent = `|R| = ${getMagnitude(compR).toFixed(1)}`;
            document.getElementById('vecR-comp').textContent = `Comp: (${compR.x.toFixed(1)}, ${compR.y.toFixed(1)})`;
            document.getElementById('vecR-ang').textContent = `Áng: ${getAngle(compR).toFixed(0)}°`;

            const absK = Math.abs(kValue);
            stepCountText.textContent = visibleSteps;
            stepTotalText.textContent = absK;

            // Construir ecuación textual dinámica
            if (kValue === 0) {
                equationDisplay.textContent = `0 · A = 0`;
            } else {
                const term = kValue < 0 ? '(-A)' : 'A';
                const terms = Array(visibleSteps).fill(term).join(' + ');
                equationDisplay.textContent = `${kValue} · A = ${terms || '0'}`;
            }
        }

        // Inicialización al cargar la página
        window.onload = () => {
            resizeCanvas();
            initPositions();
        };
    </script>
</body>
</html>
